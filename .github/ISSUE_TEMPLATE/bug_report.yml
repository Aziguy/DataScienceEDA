name: Signaler un bug
description: Un comportement inattendu dans le site, l'application ou le pipeline
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Que se passe-t-il ?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes de reproduction
      placeholder: |
        1. Aller sur ...
        2. Cliquer sur ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
  - type: dropdown
    id: area
    attributes:
      label: Composant
      options:
        - Site GitHub Pages
        - Application Streamlit
        - Pipeline / modèles
        - CI / documentation
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environnement
      placeholder: "Navigateur, OS, version de Python"
